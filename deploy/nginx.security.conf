# ==============================================================================
# CREST GROUP - Production Nginx Security Hardening Configuration
# Standards: OWASP Secure Headers, Mozilla Modern TLS 1.3, RFC 9110
# ==============================================================================

# Rate-limit zones (DDoS & Brute-Force Protection at Edge)
limit_req_zone $binary_remote_addr zone=crest_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=crest_forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=crest_api:10m rate=60r/m;

# Redirect all HTTP traffic to HTTPS permanently
server {
    listen 80;
    listen [::]:80;
    server_name crestgroup.co.tz www.crestgroup.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crestgroup.co.tz www.crestgroup.co.tz;

    # TLS 1.3 / 1.2 Modern Hardened Configuration
    ssl_certificate     /etc/letsencrypt/live/crestgroup.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crestgroup.co.tz/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Hide server version fingerprinting
    server_tokens off;

    # Cap payload size to prevent DoS / JSON bombs
    client_max_body_size 64k;

    # Real Browser-Enforced HTTP Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Static Frontend Bundle (built Vite dist/)
    root /var/www/crest-group/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Authentication Endpoint (Strictest Edge Rate Limit)
    location = /api/auth/login {
        limit_req zone=crest_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public Form Submission Endpoints
    location ~ ^/api/public/(inquiries|partnerships|applications)$ {
        limit_req zone=crest_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General & Admin API Proxy
    location /api/ {
        limit_req zone=crest_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
